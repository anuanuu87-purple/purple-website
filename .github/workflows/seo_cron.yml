name: Daily Automated SEO Article Generator

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST | 12:30 UTC = 6:00 PM IST
    - cron: '30 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run Article Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 scripts/generate_seo_blog.py

      - name: Commit and Push Generated Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily SEO blog article [skip ci]" && git pull --rebase origin main && git push origin main)
